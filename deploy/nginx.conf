# Özgensoy Kafeterya — iki alan adı da Node sunucusuna (5000) gider.
# Hangi adreste ne açılacağına sunucu karar verir (MENU_HOST): menü alanında yalnızca QR menü ve herkese açık API.
# HTTPS satırlarını certbot kendisi ekler.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  listen [::]:80;
  server_name __DOMAIN__ www.__DOMAIN__ panel.__DOMAIN__;

  client_max_body_size 12m;   # ürün görseli yükleme (sunucu sınırı 10 MB)

  location / {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;          # anlık güncellemeler (socket.io)
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }
}
